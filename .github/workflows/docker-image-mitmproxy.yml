name: mitmproxy

on:
  workflow_dispatch:
  push:
    paths:
      - 'mitmproxy/**'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_minor: ${{ steps.version.outputs.version_minor }}
      version_major: ${{ steps.version.outputs.version_major }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4.1.7
      - id: version
        run: |
          FULL=$(grep -oP '^ARG MITMPROXY_VERSION=\K[0-9.]+' mitmproxy/Dockerfile | head -1)
          test -n "$FULL"
          echo "version=$FULL" >> $GITHUB_OUTPUT
          echo "version_minor=${FULL%.*}" >> $GITHUB_OUTPUT
          echo "version_major=${FULL%%.*}" >> $GITHUB_OUTPUT
  build-amd64:
    runs-on: ubuntu-latest
    needs:
      - prepare
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4.1.7
      -
        name: Docker Setup QEMU
        uses: docker/setup-qemu-action@v3.2.0
      -
        name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3.6.1
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: ./mitmproxy/
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mitmproxy:amd64-${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  build-arm64:
    runs-on: ubuntu-24.04-arm
    needs:
      - prepare
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4.1.7
      -
        name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3.6.1
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: ./mitmproxy/
          push: true
          provenance: false
          platforms: linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mitmproxy:arm64-${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  combine-images:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - prepare
      - build-amd64
      - build-arm64
    steps:
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Docker Manifest GitHub Action(latest)
        uses: Noelware/docker-manifest-action@0.4.2
        with:
          inputs: ${{ secrets.DOCKERHUB_USERNAME }}/mitmproxy:latest
          push: true
          images: ${{ secrets.DOCKERHUB_USERNAME }}/mitmproxy:amd64-${{ needs.prepare.outputs.version }},${{ secrets.DOCKERHUB_USERNAME }}/mitmproxy:arm64-${{ needs.prepare.outputs.version }}
      -
        name: Docker Manifest GitHub Action(version)
        uses: Noelware/docker-manifest-action@0.4.2
        with:
          inputs: ${{ secrets.DOCKERHUB_USERNAME }}/mitmproxy:${{ needs.prepare.outputs.version }}
          push: true
          images: ${{ secrets.DOCKERHUB_USERNAME }}/mitmproxy:amd64-${{ needs.prepare.outputs.version }},${{ secrets.DOCKERHUB_USERNAME }}/mitmproxy:arm64-${{ needs.prepare.outputs.version }}
      -
        name: Docker Manifest GitHub Action(minor)
        uses: Noelware/docker-manifest-action@0.4.2
        with:
          inputs: ${{ secrets.DOCKERHUB_USERNAME }}/mitmproxy:${{ needs.prepare.outputs.version_minor }}
          push: true
          images: ${{ secrets.DOCKERHUB_USERNAME }}/mitmproxy:amd64-${{ needs.prepare.outputs.version }},${{ secrets.DOCKERHUB_USERNAME }}/mitmproxy:arm64-${{ needs.prepare.outputs.version }}
      -
        name: Docker Manifest GitHub Action(major)
        uses: Noelware/docker-manifest-action@0.4.2
        with:
          inputs: ${{ secrets.DOCKERHUB_USERNAME }}/mitmproxy:${{ needs.prepare.outputs.version_major }}
          push: true
          images: ${{ secrets.DOCKERHUB_USERNAME }}/mitmproxy:amd64-${{ needs.prepare.outputs.version }},${{ secrets.DOCKERHUB_USERNAME }}/mitmproxy:arm64-${{ needs.prepare.outputs.version }}
      -
        name: Smoke test merged image
        run: docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/mitmproxy:${{ needs.prepare.outputs.version }} mitmdump --version
